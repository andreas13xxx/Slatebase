name: Release

on:
  push:
    branches:
      - master
  # Rebuild the images for an existing tag without cutting a release. A re-run
  # cannot do this: release-please reports release_created=false the second time
  # around, so docker-build is skipped and nothing is rebuilt.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build images for, e.g. v0.23.0'
        required: true
        type: string
      update_latest:
        description: 'Also move the :latest tag. Turn this off when rebuilding an older release.'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    # Only a push decides about releases; a manual run just rebuilds images.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark as pre-release
        if: steps.release.outputs.release_created == 'true' && steps.release.outputs.major == '0'
        run: gh release edit ${{ steps.release.outputs.tag_name }} --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  docker-build:
    needs: release-please
    # `always()` is required because release-please is skipped on a manual run,
    # and a skipped dependency would otherwise skip this job too.
    if: |
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # The tag comes from release-please on a push, and from the input on a
    # manual run. Resolved once here so the steps below have a single source.
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      # A release always becomes :latest. A manual rebuild only does so when
      # asked, so re-running an old tag cannot move :latest backwards.
      UPDATE_LATEST: ${{ github.event_name != 'workflow_dispatch' || inputs.update_latest }}
    strategy:
      matrix:
        include:
          - image: slatebase-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            description: Slatebase Backend API Server
          - image: slatebase-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            description: Slatebase Frontend Web Application
    steps:
      # A manual run must build the tag's source, not the current master.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true
        id: dockerhub-login

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          # The arm64 image is emulated through QEMU, which makes `npm ci` and
          # the bundle build several times more expensive than they are natively.
          # Caching the layers means an unchanged package-lock.json skips the
          # dependency install entirely on the next release. Scoped per image so
          # backend and frontend do not evict each other.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          tags: |
            ghcr.io/andreas13xxx/${{ matrix.image }}:${{ env.TAG }}
            ${{ env.UPDATE_LATEST == 'true' && format('ghcr.io/andreas13xxx/{0}:latest', matrix.image) || '' }}
            ${{ steps.dockerhub-login.outcome == 'success' && format('{0}/{1}:{2}', vars.DOCKERHUB_USERNAME, matrix.image, env.TAG) || '' }}
            ${{ steps.dockerhub-login.outcome == 'success' && env.UPDATE_LATEST == 'true' && format('{0}/{1}:latest', vars.DOCKERHUB_USERNAME, matrix.image) || '' }}
          labels: |
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/andreas13xxx/Slatebase
            org.opencontainers.image.licenses=MIT

      - name: Set GHCR package visibility to public
        run: |
          gh api \
            --method PUT \
            /user/packages/container/${{ matrix.image }}/visibility \
            -f visibility=public || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
