name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      # shared-contracts is a file: dependency with a tsc build step. Build it
      # (with its own devDependencies) BEFORE the consumer's `npm ci`, so the
      # compiled dist/ is present when npm links/copies the package into
      # node_modules — otherwise the consumer resolves against missing types.
      - run: npm ci
        working-directory: shared-contracts
      - run: npm run build
        working-directory: shared-contracts
      - run: npm ci
        working-directory: backend
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run test:coverage
        working-directory: backend
      - run: npm run build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      # shared-contracts is a file: dependency with a tsc build step. Build it
      # (with its own devDependencies) BEFORE the consumer's `npm ci`, so the
      # compiled dist/ is present when npm links/copies the package into
      # node_modules — otherwise the consumer resolves against missing types.
      - run: npm ci
        working-directory: shared-contracts
      - run: npm run build
        working-directory: shared-contracts
      - run: npm ci
        working-directory: frontend
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # Both backend and frontend depend on shared-contracts (see the backend/
      # frontend jobs above). Playwright's webServer starts the backend via
      # `npx tsx src/index.ts` directly rather than `npm run dev` — the latter's
      # --env-file=.env would fail in CI, where no .env file exists — which
      # also skips backend's predev hook, so shared-contracts has to already
      # be built here instead.
      - run: npm ci
        working-directory: shared-contracts
      - run: npm run build
        working-directory: shared-contracts
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
