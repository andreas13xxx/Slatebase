name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      # shared-contracts is a file: dependency with a tsc build step. Build it
      # (with its own devDependencies) BEFORE the consumer's `npm ci`, so the
      # compiled dist/ is present when npm links/copies the package into
      # node_modules — otherwise the consumer resolves against missing types.
      - run: npm ci
        working-directory: shared-contracts
      - run: npm run build
        working-directory: shared-contracts
      - run: npm ci
        working-directory: backend
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run test:coverage
        working-directory: backend
      - run: npm run build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      # shared-contracts is a file: dependency with a tsc build step. Build it
      # (with its own devDependencies) BEFORE the consumer's `npm ci`, so the
      # compiled dist/ is present when npm links/copies the package into
      # node_modules — otherwise the consumer resolves against missing types.
      - run: npm ci
        working-directory: shared-contracts
      - run: npm run build
        working-directory: shared-contracts
      - run: npm ci
        working-directory: frontend
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
