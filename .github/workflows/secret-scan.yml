# Secret scanning. Companion to the pattern check in .githooks/pre-commit
# (section 3b): the hook is a fast, deliberately narrow local pre-filter, this
# is the authoritative gate. A hook can be skipped with --no-verify and does
# not exist at all on a fresh clone until `git config core.hooksPath .githooks`
# has been run, so the gate has to live here.
#
# Rules and allowlist: .gitleaks.toml
name: Secret Scan

permissions:
  contents: read
  # gitleaks-action posts its findings as a PR comment when it finds something.
  pull-requests: write

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - master
  schedule:
    # Weekly full-history sweep: catches anything that reached master through a
    # path the per-PR diff scan did not cover.
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan a commit range; the scheduled run
          # walks all of it.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required since gitleaks-action v2.3: without it the action refuses
          # to scan pull_request events outright. Not a licence key - this repo
          # belongs to an individual account, which the action scans for free.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
