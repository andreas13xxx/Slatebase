# Shared security headers for the SPA document and all static assets.
#
# `add_header` in a `location` block replaces every `add_header` inherited
# from `server{}` (it does not merge) — so this file is `include`d in every
# `location` block below that itself sets `add_header` (e.g. `Cache-Control`),
# not just once at the `server{}` level. See nginx docs on `add_header` and
# https://forum.nginx.org/read.php?2,88170,88170 for the inheritance trap.
#
# Directives mirror `backend/src/index.ts`'s `secureHeaders(...)` CSP 1:1 —
# see that file for the per-directive rationale (plugin blob: bundles,
# canvas link-node iframes, inline vault images, etc).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://api.github.com; frame-src 'self' https:; object-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
