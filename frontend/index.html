<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <!-- viewport-fit=cover lets the app use the whole screen on iPad; App.css pads .app by the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <!-- Installable: "Add to Home Screen" starts the app full screen without the browser chrome. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Slatebase" />
    <title>Slatebase</title>
    <!-- moment.js for Obsidian plugin compatibility (Calendar, etc.). `defer` keeps
         it off the parser-blocking path while preserving the guarantee that
         window.moment exists before the app boots: deferred classic scripts and
         module scripts both run after parsing, in document order, so this still
         executes before src/main.tsx below it. -->
    <script src="/moment.min.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
