server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API requests → proxy to backend container
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File upload limits (matches backend maxImportFileSize: 500 MB)
        client_max_body_size 512m;

        # Timeouts for large uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # MCP discovery (/.well-known/mcp.json) → proxy to backend container.
    # Without this, the SPA fallback below serves index.html for this path instead.
    location /.well-known/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hunspell dictionaries fetched by the spellcheck worker.
    #
    # nginx has no MIME type for .aff/.dic and would send them as
    # application/octet-stream, which the gzip_types list above doesn't cover —
    # declaring them text/plain cuts the German dictionary from 1.1 MB to
    # roughly a third of that on the wire.
    #
    # Their names are not content-hashed (the worker requests fixed paths), so
    # they deliberately don't get the "immutable, 1 year" treatment below: a
    # dictionary updated in a new release still reaches clients within a week.
    location ~* \.(aff|dic)$ {
        default_type text/plain;
        charset utf-8;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
