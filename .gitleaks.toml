# gitleaks configuration for Slatebase.
#
# Runs in CI (.github/workflows/secret-scan.yml) as the authoritative secret
# gate. The pre-commit hook (.githooks/pre-commit, section 3b) carries a much
# narrower pattern set as a fast local pre-filter - if you change what counts
# as a secret, change it in both places.
#
# Both layers honour gitleaks' inline `gitleaks:allow` marker, so annotating a
# false positive once satisfies the hook and this scan alike.

[extend]
useDefault = true

[[rules]]
id = "slatebase-password-literal"
description = "Password-shaped literal assigned to a password-shaped name"
regex = '''(?i)(pass|passwd|password|pwd)[a-z_]*\s*[=:]\s*["'`]([A-Za-z0-9!@#$%^&*_+-]{8,})["'`]'''
secretGroup = 2
keywords = ["pass", "passwd", "password", "pwd"]

# Dummy credentials used by the existing test fixtures. Listed by value rather
# than matched by a cleverer rule: a regex that tries to tell "ValidPass1!"
# from a real password gets it wrong in both directions.
[rules.allowlist]
# Test against the whole matched line, not just the secret. The i18n-label
# entry below keys on the property name (`passwordLabel:`), which is not part
# of the captured secret. gitleaks defaults RegexTarget to the secret; the
# value-based entries below match as substrings against the line just the same.
regexTarget = "line"
regexes = [
  '''ValidPass1!''',
  '''password123''',
  '''securepass123''',
  '''wrongpass1''',
  '''mypassword''',
  '''secret123''',
  '''unused-in-config-store''',
  '''ABCDEFGHJKLMNPQRSTUVWXYZ''',
  # Dummy passwords in current frontend test fixtures (change-password and
  # admin-user-creation flows).
  '''newpass123''',
  '''TempPass123''',
  '''oldpass''',
  # Screenshot script demo password (history only; the literal is now read from
  # the SCREENSHOT_PASS env var).
  '''Slatebase''',
  # Alphabet for the temporary-password GENERATOR in user/index.ts - a character
  # set, not a secret. (The uppercase half is already listed above.)
  '''ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789''',
  # i18n display strings and their test assertions: a key like `passwordLabel`
  # or `passwordPlaceholder` carries UI text ("Passwort", "Mindestens 8
  # Zeichen"), never a secret, but still matches the password-shaped-name rule.
  # Matched on the key name so new labels are covered without a per-string entry.
  '''(?i)(pass|passwd|password|passphrase|pwd)[a-z]*(label|placeholder)\s*[=:]''',
  # The "how NOT to do it" example in CONTRIBUTING.md. It carries an inline
  # `gitleaks:allow`, but that only clears the commit it appears in - a PR scan
  # walks every commit in the range, so a line that was introduced without the
  # marker and annotated later still fails. An allowlist entry covers the whole
  # range.
  '''meinEchtesPasswort''',
]

[allowlist]
description = "Known non-secrets in this repository"

paths = [
  # Lockfiles: integrity hashes trip entropy rules, nothing secret goes in.
  '''package-lock\.json$''',
  # Hunspell dictionaries: megabytes of words, entropy heuristics have a field day.
  '''\.(aff|dic)$''',
  # Removed Vault-Sync module: its tests carried dummy passphrases/passwords
  # (e2ePassphrase, passwordEncrypted, ...). The code no longer exists in the
  # tree; the full-history sweep still walks the commits that introduced it.
  '''backend/src/sync/.*\.test\.ts$''',
  # Documentation with illustrative-only API tokens ("abc123...def456",
  # "tokenId": "...", tokenHash placeholders) — prose examples, not real values.
  '''(^|/)MCP\.md$''',
  '''(^|/)README\.md$''',
  '''\.kiro/specs/.*\.md$''',
  # i18n message catalogs: display text only (`password: 'Passwort'`, button
  # labels, placeholders). Never secret values. The password-shaped-name rule
  # matches the plain `password` key, which no *Label/*Placeholder pattern covers.
  '''frontend/src/i18n/.*\.ts$''',
]

regexes = [
  # The PEM header as a literal string in tests and as an input placeholder -
  # a header with no key material after it.
  '''-----BEGIN OPENSSH PRIVATE KEY-----''',
]

# The credential removed in this branch is still reachable in history at commit
# 6921bc3 (2026-05-26). It is allowlisted so a full-history scan reports a clean
# result rather than a permanent known failure. The real remediation was
# rotating the password - see CONTRIBUTING.md, "Keine Secrets im Repository".
commits = [
  "6921bc37b7899b90bc248dc0ec23698e93be6db0",
]
