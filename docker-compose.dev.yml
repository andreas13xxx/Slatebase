services:
  backend:
    # Context is the repo root, not ./backend: the image depends on the sibling
    # shared-contracts/ package (a file: dependency built inside the image).
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: slatebase-backend
    restart: unless-stopped
    env_file:
      - ./docker.env
    volumes:
      - slatebase-data:/app/data
    networks:
      - slatebase-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    # Context is the repo root, not ./frontend (see backend above).
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: slatebase-frontend
    restart: unless-stopped
    ports:
      - "${SLATEBASE_EXTERNAL_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - slatebase-net

volumes:
  slatebase-data:
    driver: local

networks:
  slatebase-net:
    driver: bridge
